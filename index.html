<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d504b">
  <meta name="description" content="FishLogger is a private fishing journal for logging catches by voice on the water.">
  <meta property="og:title" content="FishLogger: Fishing Journal">
  <meta property="og:description" content="Say the catch once. Find the pattern later.">
  <title>FishLogger: Fishing Journal</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #092d2f;
      --ink: #fff8eb;
      --muted: rgba(255, 248, 235, 0.78);
      --line: rgba(255, 248, 235, 0.18);
      --gold: #e9a84a;
      --gold-dark: #9a5b17;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        linear-gradient(180deg, rgba(2, 18, 20, 0.18), rgba(2, 18, 20, 0.82)),
        radial-gradient(circle at 30% 10%, rgba(233, 168, 74, 0.25), transparent 28rem),
        var(--bg);
      color: var(--ink);
    }

    main {
      width: min(100%, 560px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 42px 22px 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
    }

    .mark {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0d6860, #06383c);
      border: 1px solid var(--line);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.24);
      font-size: 38px;
      font-weight: 800;
      color: var(--gold);
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 12vw, 72px);
      line-height: 0.94;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.45;
    }

    .actions {
      display: grid;
      gap: 12px;
    }

    a.button {
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      padding: 16px 18px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .primary {
      color: #1c1205;
      background: linear-gradient(180deg, #ffc76e, var(--gold));
      box-shadow: 0 16px 42px rgba(233, 168, 74, 0.28);
    }

    .secondary {
      color: var(--ink);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.08);
    }

    .note {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255, 248, 235, 0.66);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">F</div>
    <section>
      <h1>Say the catch once.</h1>
      <p>FishLogger is a private fishing journal for people who hate typing notes on the water.</p>
    </section>
    <nav class="actions" aria-label="FishLogger links">
      <a class="button primary" href="https://apps.apple.com/us/app/fishlogger-fishing-journal/id6757573416?ct=github_pages_bridge">Open on the App Store</a>
      <a class="button secondary" href="https://testflight.apple.com/join/8G7G63b6">Join the TestFlight beta</a>
      <a class="button secondary" href="https://apps.apple.com/redeem?ctx=offercodes&amp;id=6757573416&amp;code=FISHLOGGER">Use code FISHLOGGER</a>
    </nav>
    <p class="note">Code FISHLOGGER gives new yearly Pro customers one free month through May 31. Spots stay private.</p>
  </main>
</body>
</html>
